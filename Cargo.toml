[package]
name = "suno"
version = "0.10.2"
edition = "2024"
rust-version = "1.89"
description = "Generate AI music from your terminal — Suno music with headless auth, v6, resumable jobs, and reliable downloads"
license = "MIT"
repository = "https://github.com/paperfoot/suno-cli"
homepage = "https://github.com/paperfoot/suno-cli"
readme = "README.md"
keywords = ["suno", "music", "ai", "cli", "audio"]
categories = ["command-line-utilities", "multimedia::audio"]

[[bin]]
name = "suno"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "fs", "process", "net", "signal"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream", "blocking"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
figment = { version = "0.10", features = ["toml", "env"] }
comfy-table = "7"
indicatif = "0.17"
directories = "5"
base64 = "0.22"
sha2 = "0.10"
semver = "1"
tar = "0.4"
flate2 = "1"
zip = { version = "6", default-features = false, features = ["deflate"] }
self-replace = "1.5"
tempfile = "3"
futures-util = "0.3"
id3 = "1"
rookie = "0.5"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
toml = "0.8"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
figment = { version = "0.10", features = ["toml", "env", "test"] }
jsonschema = { version = "0.48.1", default-features = false }

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
