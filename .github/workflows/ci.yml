name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked --release
      # Vendored framework contract probe (conformance/ tracks
      # paperfoot/agent-cli-framework) — the release binary must conform.
      - run: ./conformance/conformance.sh target/release/suno
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: python -m pip install -r conformance/requirements.txt
      - run: python conformance/validate.py target/release/suno

  # Exercise filesystem locks, archive extraction, and paths on each desktop OS.
  cross-platform:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --locked --all-targets
      - run: cargo test --locked
